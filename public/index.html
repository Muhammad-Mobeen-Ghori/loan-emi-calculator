<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Loan EMI Calculator</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background: #f1f4f9;
        }

        .main-container {
            max-width: 1000px;
            margin: 40px auto;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .result-box {
            background: #e8f5e9;
            border-radius: 10px;
            padding: 20px;
        }

        .emi-value {
            font-size: 30px;
            font-weight: bold;
            color: #198754;
        }

        .table {
            background: white;
        }
    </style>

</head>

<body>

<div class="container main-container">

    <h2 class="text-center mb-4">
        Loan EMI Calculator
    </h2>

    <!-- Calculator Form -->

    <div class="card p-4 mb-4">

        <h4 class="mb-3">Calculate Your Loan EMI</h4>

        <form id="emiForm">

            <div class="mb-3">

                <label class="form-label">
                    Loan Amount (Principal)
                </label>

                <input
                    type="number"
                    class="form-control"
                    id="principal"
                    min="0.01"
                    step="any"
                    placeholder="Enter loan amount"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Annual Interest Rate (%)
                </label>

                <input
                    type="number"
                    class="form-control"
                    id="rate"
                    min="0.01"
                    step="any"
                    placeholder="Enter annual interest rate"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Tenure (Months)
                </label>

                <input
                    type="number"
                    class="form-control"
                    id="months"
                    min="1"
                    step="1"
                    placeholder="Enter tenure in months"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100">

                Calculate EMI

            </button>

        </form>

        <div id="errorMessage" class="alert alert-danger mt-3"
             style="display:none;"></div>

    </div>


    <!-- Result Panel -->

    <div class="card p-4 mb-4" id="resultPanel"
         style="display:none;">

        <h4 class="mb-3">Calculation Result</h4>

        <div class="result-box">

            <p>Monthly EMI</p>

            <div class="emi-value" id="emi"></div>

            <hr>

            <p>
                Total Payment:
                <strong id="totalPayment"></strong>
            </p>

            <p>
                Total Interest:
                <strong id="totalInterest"></strong>
            </p>

            <hr>

            <p>
                Served By:
                <strong id="servedBy"></strong>
            </p>

            <p>
                Pod IP:
                <strong id="podIP"></strong>
            </p>

        </div>

    </div>


    <!-- History Table -->

    <div class="card p-4">

        <h4 class="mb-3">Calculation History</h4>

        <div class="table-responsive">

            <table class="table table-bordered table-striped">

                <thead class="table-dark">

                    <tr>
                        <th>Principal</th>
                        <th>Rate (%)</th>
                        <th>Months</th>
                        <th>EMI</th>
                        <th>Served By</th>
                        <th>Date</th>
                    </tr>

                </thead>

                <tbody id="historyTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

    // Format currency
    function formatAmount(amount) {
        return Number(amount).toLocaleString(
            "en-PK",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );
    }


    // Submit EMI form using AJAX
    $("#emiForm").submit(function(event) {

        event.preventDefault();

        const P = Number($("#principal").val());
        const rate = Number($("#rate").val());
        const n = Number($("#months").val());

        $("#errorMessage").hide();

        // Client-side validation
        if (
            !Number.isFinite(P) ||
            !Number.isFinite(rate) ||
            !Number.isFinite(n) ||
            P <= 0 ||
            rate <= 0 ||
            n <= 0 ||
            !Number.isInteger(n)
        ) {

            $("#errorMessage")
                .text("Please enter positive numbers. Tenure must be a whole number.")
                .show();

            return;
        }


        $.ajax({

            url: "/api/emi",

            method: "POST",

            contentType: "application/json",

            data: JSON.stringify({
                P: P,
                rate: rate,
                n: n
            }),

            success: function(response) {

                // Update result panel only
                $("#emi").text(formatAmount(response.emi));

                $("#totalPayment").text(
                    formatAmount(response.totalPayment)
                );

                $("#totalInterest").text(
                    formatAmount(response.totalInterest)
                );

                $("#servedBy").text(response.servedBy);

                $("#podIP").text(response.podIP);

                $("#resultPanel").show();

                // Refresh history table
                loadHistory();

            },

            error: function(xhr) {

                const message = xhr.responseJSON
                    ? xhr.responseJSON.error
                    : "An unexpected error occurred.";

                $("#errorMessage")
                    .text(message)
                    .show();

            }

        });

    });


    // Load calculation history
    function loadHistory() {

        $.ajax({

            url: "/api/history",

            method: "GET",

            success: function(data) {

                let rows = "";

                data.forEach(function(item) {

                    rows += `
                        <tr>
                            <td>${formatAmount(item.principal)}</td>
                            <td>${item.rate}</td>
                            <td>${item.months}</td>
                            <td>${formatAmount(item.emi)}</td>
                            <td>${escapeHTML(item.servedBy)}</td>
                            <td>${new Date(item.createdAt).toLocaleString()}</td>
                        </tr>
                    `;

                });

                $("#historyTable").html(rows);

            },

            error: function() {

                $("#historyTable").html(
                    '<tr><td colspan="6">Unable to load history.</td></tr>'
                );

            }

        });

    }


    // Escape server-provided text before displaying it
    function escapeHTML(value) {

        return String(value).replace(/[&<>"']/g, function(char) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];

        });

    }


    // Load history when page opens
    $(document).ready(function() {

        loadHistory();

    });

</script>

</body>
</html>
